name: bulk-stage-move

x-app: &app
  build: .
  image: bulk-stage-move:local
  environment:
    DATABASE_URL: postgres://crm:crm@postgres:5432/crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      # 5433 on the host so a locally installed Postgres on 5432 doesn't collide.
      - '${PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ['node', 'dist/db/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app
    # Small dataset on `up`; skips workspaces that already exist. Full: `make seed-full`.
    command: ['node', 'dist/scripts/seed.js', '--small']
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    <<: *app
    command: ['npm', 'test']
    environment:
      # A separate database, dropped and re-migrated at the start of every run.
      TEST_DATABASE_URL: postgres://crm:crm@postgres:5432/crm_test
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Benchmarks run inside the compose network, so host port forwarding doesn't add noise.
  # Not started by `up`; run with `docker compose run --rm bench`.
  bench:
    <<: *app
    profiles: ['bench']
    command: ['node', 'dist/bench/isolation.js']
    environment:
      DATABASE_URL: postgres://crm:crm@postgres:5432/crm
      API_URL: http://api:3000

  worker:
    <<: *app
    command: ['node', 'dist/worker/main.js']
    environment:
      DATABASE_URL: postgres://crm:crm@postgres:5432/crm
      # Deals per second per job; 0 disables pacing. Override from the shell to compare.
      WORKER_MAX_DEALS_PER_SECOND: ${WORKER_MAX_DEALS_PER_SECOND:-10000}
      # How long a job keeps its worker while other workspaces wait; 0 disables time slicing.
      WORKER_SLICE_MS: ${WORKER_SLICE_MS:-5000}
    # On `docker compose stop` the worker finishes its batch in flight and hands its job back.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
